name: Validate and Publish Dev Container Templates

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: templates-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Install Dev Container CLI
        run: npm install --global @devcontainers/cli@0.89.0
      - name: Build and test Flutter template
        shell: bash
        run: bash test/flutter-smoke.sh

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Build and publish Dev Container Templates
        uses: devcontainers/action@v1.4.4
        with:
          publish-templates: "true"
          base-path-to-templates: "./src"
          generate-docs: "false"
          devcontainer-cli-version: "0.89.0"

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Read back published template
        run: npx --yes @devcontainers/cli@0.89.0 templates metadata ghcr.io/${{ github.repository }}/flutter:2
